<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>连接 SellerSpace</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #f5f7fb;
        color: #111a33;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: flex;
        justify-content: center;
        background: #f5f7fb;
      }

      .shell {
        width: min(100%, 680px);
        min-height: 100vh;
        overflow: hidden;
        background: #fff;
        box-shadow: 0 0 48px rgba(39, 52, 91, 0.08);
      }

      .hero {
        min-height: 300px;
        padding: 44px 38px 34px;
        background: #eef1ff url("/assets/connection-hero.png") center / cover
          no-repeat;
      }

      .brand-logo {
        display: block;
        width: 178px;
        height: auto;
      }

      h1 {
        margin: 40px 0 0;
        color: #0c142a;
        font-size: 43px;
        font-weight: 760;
        letter-spacing: -0.035em;
        line-height: 1.15;
      }

      .lead {
        max-width: 470px;
        margin: 14px 0 0;
        color: #536078;
        font-size: 18px;
        line-height: 1.65;
      }

      .content {
        padding: 28px 38px 32px;
      }

      .connection {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 72px;
        padding-bottom: 22px;
        border-bottom: 1px solid #e3e7f0;
      }

      .connection-brand,
      .connection-path {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 50px;
        border-radius: 12px;
      }

      .connection-brand {
        width: 112px;
        flex: 0 0 112px;
        background: #f3f0ff;
      }

      .connection-brand img {
        width: 88px;
        height: auto;
      }

      .connection-path {
        padding: 0 14px;
        color: #2f67de;
        background: #f0f6ff;
        font-size: 15px;
        font-weight: 700;
        white-space: nowrap;
      }

      .secure {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: #0a9d72;
        font-size: 14px;
        font-weight: 700;
        white-space: nowrap;
        margin-left: auto;
      }

      .secure img,
      .privacy img {
        width: 21px;
        height: 21px;
      }

      .prerequisite {
        display: flex;
        gap: 14px;
        margin: 28px 0 26px;
        padding: 20px;
        border: 1px solid #dedafa;
        border-radius: 14px;
        background: #f8f7ff;
      }

      .prerequisite > img {
        width: 28px;
        height: 28px;
        margin-top: 1px;
      }

      .prerequisite h2 {
        margin: 0;
        color: #1b2440;
        font-size: 17px;
        line-height: 1.45;
      }

      .prerequisite p {
        margin: 5px 0 8px;
        color: #68738a;
        font-size: 14px;
        line-height: 1.55;
      }

      a {
        color: #5d55e7;
        font-weight: 650;
        text-underline-offset: 3px;
      }

      label {
        display: block;
        margin-bottom: 9px;
        color: #172038;
        font-size: 15px;
        font-weight: 720;
      }

      .field {
        display: flex;
        min-height: 58px;
        overflow: hidden;
        border: 1px solid #cbd2df;
        border-radius: 13px;
        background: #fff;
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      .field:focus-within {
        border-color: #7066ee;
        box-shadow: 0 0 0 3px rgba(112, 102, 238, 0.13);
      }

      input {
        min-width: 0;
        flex: 1;
        padding: 15px 16px;
        border: 0;
        outline: 0;
        color: #111a33;
        background: transparent;
        font: inherit;
      }

      input::placeholder {
        color: #a4adbd;
      }

      .reveal {
        border: 0;
        padding: 0 16px;
        color: #5d55e7;
        background: transparent;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      .reveal:focus-visible,
      a:focus-visible {
        outline: 3px solid rgba(112, 102, 238, 0.2);
        outline-offset: 3px;
        border-radius: 4px;
      }

      .submit {
        width: 100%;
        min-height: 58px;
        margin-top: 18px;
        border: 0;
        border-radius: 13px;
        color: #fff;
        background: #6257e9;
        box-shadow: 0 10px 24px rgba(83, 72, 221, 0.2);
        font: inherit;
        font-weight: 750;
        cursor: pointer;
        transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
      }

      .submit:hover:not(:disabled) {
        background: #5549dd;
        box-shadow: 0 12px 28px rgba(83, 72, 221, 0.26);
        transform: translateY(-1px);
      }

      .submit:focus-visible {
        outline: 3px solid rgba(112, 102, 238, 0.24);
        outline-offset: 3px;
      }

      .submit:disabled {
        opacity: 0.62;
        cursor: wait;
        transform: none;
      }

      .status {
        min-height: 24px;
        margin: 14px 0 0;
        color: #68738a;
        font-size: 13px;
        line-height: 1.55;
      }

      .status.error {
        color: #bd2c3b;
      }

      .status.success {
        color: #087653;
      }

      .privacy {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 22px;
        padding-top: 22px;
        border-top: 1px solid #e3e7f0;
        color: #68738a;
        font-size: 13px;
        line-height: 1.55;
      }

      @media (max-width: 520px) {
        .hero {
          min-height: 264px;
          padding: 28px 24px 26px;
          background-position: 58% center;
        }

        .brand-logo {
          width: 148px;
        }

        h1 {
          margin-top: 30px;
          font-size: 34px;
        }

        .lead {
          font-size: 15px;
        }

        .content {
          padding: 24px;
        }

        .connection {
          align-items: flex-start;
          flex-direction: column;
          gap: 8px;
        }

        .connection-brand,
        .connection-path {
          width: 100%;
        }

        .connection-brand {
          flex-basis: auto;
        }

        .secure {
          margin-left: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="hero" aria-labelledby="page-title">
        <img
          class="brand-logo"
          src="/assets/sellerspace-logo.png"
          alt="优麦云 SellerSpace"
        >
        <h1 id="page-title">连接 SellerSpace</h1>
        <p class="lead">安全授权当前 AI 助手读取你的店铺数据</p>
      </section>

      <section class="content">
        <div class="connection" aria-label="SellerSpace 安全连接 AI 助手">
          <span class="connection-brand">
            <img src="/assets/sellerspace-logo.png" alt="SellerSpace">
          </span>
          <span class="connection-path">SellerSpace → AI 助手</span>
          <span class="secure">
            <img src="/assets/check-circle.svg" alt="" aria-hidden="true">
            安全连接
          </span>
        </div>

        <aside class="prerequisite">
          <img src="/assets/check-circle.svg" alt="" aria-hidden="true">
          <div>
            <h2>使用前需完成授权</h2>
            <p>请先注册或登录 SellerSpace，并在 MCP 页面生成 API Key。</p>
            <a
              href="https://www.sellerspace.com/web/mcp/settings"
              target="_blank"
              rel="noreferrer"
            >
              注册/登录并获取 API Key
            </a>
          </div>
        </aside>

        <form id="configuration-form">
          <label for="api-key">SellerSpace API Key</label>
          <div class="field">
            <input
              id="api-key"
              name="apiKey"
              type="password"
              placeholder="粘贴你的 API Key"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
              maxlength="4096"
              required
              autofocus
            >
            <button class="reveal" id="reveal" type="button">显示</button>
          </div>
          <button class="submit" id="submit" type="submit">验证并保存</button>
        </form>

        <p class="status" id="status" role="status" aria-live="polite"></p>

        <div class="privacy">
          <img src="/assets/check-circle.svg" alt="" aria-hidden="true">
          <span>Key 仅保存在本机，不会发送到 AI 对话。</span>
        </div>
      </section>
    </main>

    <script>
      const form = document.getElementById("configuration-form");
      const input = document.getElementById("api-key");
      const submit = document.getElementById("submit");
      const status = document.getElementById("status");
      const reveal = document.getElementById("reveal");
      const setupPath = window.location.pathname.replace(/\/$/, "");

      reveal.addEventListener("click", () => {
        const revealing = input.type === "password";
        input.type = revealing ? "text" : "password";
        reveal.textContent = revealing ? "隐藏" : "显示";
        input.focus();
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        status.className = "status";
        status.textContent = "正在验证…";
        submit.disabled = true;

        try {
          const response = await fetch(`${setupPath}/save`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ apiKey: input.value }),
          });
          const result = await response.json();
          if (!response.ok || !result.ok) {
            throw new Error(result.message || "配置失败，请重试。");
          }
          input.value = "";
          input.disabled = true;
          reveal.disabled = true;
          submit.disabled = true;
          submit.textContent = "已连接";
          status.className = "status success";
          status.textContent = result.message;
        } catch (error) {
          status.className = "status error";
          status.textContent = error instanceof Error
            ? error.message
            : "配置失败，请重试。";
          submit.disabled = false;
        }
      });
    </script>
  </body>
</html>
